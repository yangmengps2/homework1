name: build and push docker image

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-southeast-2
      ECR_REGISTRY: 939503809934.dkr.ecr.ap-southeast-2.amazonaws.com
      ECR_REPOSITORY: helloapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939503809934:role/GithubActionsCICDRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (immutable)
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image (tagged by git sha)
        run: |
          cd app
          docker build -t "${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

      # 拿到 digest（用于验证/记录；后续也可让 image updater 用 digest 策略）
      - name: Get pushed image digest
        id: digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Print image info
        run: |
          echo "IMAGE_URI=${IMAGE_URI}"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
          echo "IMAGE_REF=${IMAGE_URI}@${IMAGE_DIGEST}"
