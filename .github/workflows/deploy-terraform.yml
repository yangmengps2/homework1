name: deploy terraform (infra-tf)

on:
  push:
    branches: [ main ]
    paths:
      - "infra-tf/**"
      - ".github/workflows/deploy-terraform.yml"

  #workflow_run:
    #workflows: ["Build and Push Docker Image"]
    #types: [completed]

  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infra-tf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939503809934:role/GithubActionsCICDRole
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init (S3 backend)
        run: terraform init

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (output file)
        env:
          TF_VAR_container_image: 939503809934.dkr.ecr.ap-southeast-2.amazonaws.com/helloapp:latest
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra-tf/tfplan

  apply:
    runs-on: ubuntu-latest
    needs: [plan]

    # ✅ 关键：任何触发来源都必须手工审批才会继续
    environment: terraform-apply

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infra-tf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra-tf

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939503809934:role/GithubActionsCICDRole
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init (S3 backend)
        run: terraform init

      - name: Terraform apply (approved plan)
        run: terraform apply -auto-approve tfplan
