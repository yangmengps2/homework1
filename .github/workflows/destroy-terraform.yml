name: destroy terraform (infra-tf) - dev only

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: 'NO'

permissions:
  id-token: write
  contents: read

env:
  ENV: dev
  TFVARS: envs/dev.tfvars

jobs:
  destroy:
    runs-on: ubuntu-latest
    # 保留：手工审批（跟 apply 一样的保护）
    environment: terraform-apply

    defaults:
      run:
        working-directory: infra-tf

    steps:
      - uses: actions/checkout@v4

      - name: Guard - require confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed. Type DESTROY to run."
            exit 1
          fi

      - name: Ensure tfvars exists
        run: |
          test -f "$TFVARS" || (echo "Missing $TFVARS" && exit 1)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939503809934:role/GithubActionsCICDRole
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Select workspace (dev)
        run: terraform workspace select "$ENV" || terraform workspace new "$ENV"

      # 可选但推荐：先跑 plan destroy，方便你在日志里确认要删什么
      - name: Plan Destroy (dev)
        run: terraform plan -destroy -input=false -no-color -var-file="$TFVARS"

      - name: Destroy (dev)
        run: terraform destroy -auto-approve -input=false -var-file="$TFVARS"
